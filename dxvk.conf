# Alien: Isolation — Linux/Proton FPS fix
# https://github.com/sidnei-almeida/alien-isolation-linux-fix
#
# Keeps the game's dynamic D3D11 buffers in cached system memory instead of
# host-visible VRAM. The engine reads those buffers back on the CPU every
# frame; with Resizable BAR enabled that readback crosses PCIe and stalls
# the render thread. Drop this file next to AI.exe.
d3d11.cachedDynamicResources = a
